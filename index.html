<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faraón</title>
    <style>
        :root { --bg: #0b3d14; --card-w: 80px; --card-h: 125px; --gold: #d4af37; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; height: 100vh; overflow: hidden; touch-action: none; user-select: none; }
        
        .screen { display: none; flex-direction: column; height: 100vh; width: 100vw; justify-content: center; align-items: center; position: absolute; top: 0; left: 0; background: var(--bg); overflow: hidden; }
        #screen-menu { display: flex; }
        #screen-game { justify-content: space-between; position: relative; }
        
        h1 { color: var(--gold); text-shadow: 2px 2px 4px #000; font-size: 40px; margin-bottom: 10px; text-align: center; margin-top: 0; }
        .btn { background: linear-gradient(to bottom, #4a2f13, #2b1808); border: 2px solid var(--gold); color: white; padding: 12px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 8px; margin: 8px; width: 220px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); text-align: center; transition: transform 0.1s; }
        .btn:active { transform: translateY(2px); }
        
        .panel { background: rgba(0,0,0,0.8); border: 2px solid var(--gold); padding: 15px 20px; border-radius: 10px; width: 90%; max-width: 400px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 6px; margin-bottom: 2px; }
        .setting-row label { font-size: 13px; line-height: 1.2; flex: 1; padding-right: 10px; }
        .setting-row input[type="number"], .setting-row select { padding: 6px; border-radius: 6px; background: #222; color: white; border: 1px solid var(--gold); font-size: 14px; width: 60px; }
        .setting-row select { width: auto; cursor: pointer; }
        .setting-row input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; }
        
        #money-display { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--gold); font-weight: bold; font-size: 16px; color: #4ade80; z-index: 50; }
        
        /* Karty obal */
        .hand { position: relative; width: 100vw; z-index: 10; height: 160px; margin: 10px 0; }
        #table { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; position: relative; gap: 20px; }
        
        .game-row { display: flex; align-items: center; justify-content: center; gap: 40px; }
        
        #turn-token { width: 65px; height: 65px; background: #5c3a21; border: 3px solid var(--gold); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; font-size: 11px; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.7); transition: transform 0.15s, background-color 0.3s; z-index: 100; cursor: pointer; text-align: center; }
        #turn-token:active { transform: scale(0.95); }
        
        .card { width: var(--card-w); height: var(--card-h); background-size: 100% 100%; background-position: center; background-repeat: no-repeat; border-radius: 6px; box-shadow: -2px 2px 6px rgba(0,0,0,0.6); flex-shrink: 0; cursor: grab; position: absolute; border: 1px solid #111; background-color: #fdf5e6; transition: transform 0.2s ease, left 0.3s ease, top 0.3s ease; }
        .card:active { cursor: grabbing; }
        
        #player-hand .card:hover { transform: translateY(-15px) !important; z-index: 50 !important; }
        #player-hand .card.selected { transform: translateY(-25px) !important; box-shadow: 0 0 15px var(--gold); z-index: 100 !important; border-color: var(--gold); }
        #bot-hand .card { cursor: default; }
        
        /* Balicky CSS */
        .pile-container { width: var(--card-w); height: var(--card-h); position: relative; }
        .deck-card { position: absolute; cursor: grab; }
        .discard-card { position: absolute; top: 0; left: 0; cursor: default; }
        
        /* Animovana / Drag karta */
        .moving-card { position: fixed; z-index: 9999 !important; pointer-events: none; transform: scale(1.05); transition: none; }
        .bot-anim-card { position: fixed; z-index: 9999 !important; pointer-events: none; transition: all 0.4s ease-out; }
        
        /* SHUFFLE ANIMATION OVERLAY */
        #shuffle-overlay { position: fixed; inset: 0; background: rgba(11, 61, 20, 0.9); z-index: 3000; display: none; flex-direction: column; justify-content: center; align-items: center; color: var(--gold); }
        .shuffle-deck { width: var(--card-w); height: var(--card-h); position: relative; margin-bottom: 20px; }
        .shuffle-card { position: absolute; width: 100%; height: 100%; border-radius: 6px; background-image: repeating-linear-gradient(45deg, #a00 0, #a00 4px, #700 4px, #700 8px); border: 1px solid #111; }
        @keyframes shuffle-left { 0% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(-60px) rotate(-15deg); z-index: 10;} 100% { transform: translateX(0) rotate(0deg); z-index: 1;} }
        @keyframes shuffle-right { 0% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(60px) rotate(15deg); z-index: 10;} 100% { transform: translateX(0) rotate(0deg); z-index: 1;} }
        .s-left { animation: shuffle-left 0.4s ease-in-out infinite; }
        .s-right { animation: shuffle-right 0.4s ease-in-out infinite reverse; }

        .card-inner { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; border-radius: 5px; }
        .half { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .top-half { border-bottom: 2px solid rgba(0,0,0,0.4); }
        .bottom-half { transform: rotate(180deg); }
        .corner-label { position: absolute; top: 2px; left: 4px; font-weight: bold; font-size: 14px; font-family: 'Times New Roman', serif; line-height: 1; }
        .figure { position: absolute; bottom: -13px; font-size: 46px; line-height: 1; width: 100%; text-align: center; } 
        .fig-sym { position: absolute; font-size: 16px; line-height: 1; }
        .sym-vysnik { top: 18px; left: 4px; }
        .sym-niznik { bottom: 4px; left: 4px; }
        .sym-eso { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 36px; }
        
        .sym-grid { display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center; align-items: center; gap: 1px; width: 85%; margin-top: 12px; height: 60%; }
        .sym-grid span { font-size: 12px; line-height: 1; }
        .sym-grid.dense { grid-template-columns: repeat(4, 1fr); gap: 1px; width: 90%; margin-top: 10px; height: 60%; }
        .sym-grid.dense span { font-size: 10px; }

        .back { background-image: repeating-linear-gradient(45deg, #a00 0, #a00 4px, #700 4px, #700 8px); background-color: #800; }

        #picker { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff8e7; padding: 15px; display: none; grid-template-columns: 1fr 1fr; gap: 10px; z-index: 1000; border: 4px solid #4a2f13; border-radius: 8px; box-shadow: 0 0 50px #000; }
        .p-btn { width: 75px; height: 75px; border: 2px solid #4a2f13; background: #fff; cursor: pointer; border-radius: 6px; font-size: 24px; color: black; font-weight: bold; }
        
        #message-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        #msg-title { font-size: 36px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; padding: 0 20px;}
        #msg-money { font-size: 22px; margin-bottom: 20px; font-weight: bold; }
        #msg-sub { font-size: 18px; color: #ffeb3b; margin-bottom: 10px; }
        #msg-timer { font-size: 16px; color: #aaa; }
        
        .debug-label { font-size: 16px; color: #fff; font-weight: bold; margin: 0 10px; text-shadow: 1px 1px 2px #000; }
    </style>
</head>
<body>

<div id="money-display"><span id="money-val">0</span> €</div>

<div id="screen-menu" class="screen">
    <h1>FARAÓN</h1>
    <button class="btn" id="btn-start" onclick="playMenuClick(); startNewTournament()">Hrať</button>
    <button class="btn" id="btn-continue" onclick="playMenuClick(); startGame(true)" style="display:none; background: linear-gradient(to bottom, #184a13, #0b2b08);">Pokračovať</button>
    <button class="btn" onclick="playMenuClick(); showSettings()">Nastavenia</button>
</div>

<div id="screen-settings" class="screen">
    <div class="panel">
        <h2 style="color:var(--gold); text-align:center; margin:0 0 5px 0;">Pravidlá</h2>
        <div class="setting-row">
            <label>Hudba (sfx/hudba.mp3)</label><input type="checkbox" id="cfg-music">
        </div>
        <div class="setting-row">
            <label>Zvukové efekty</label><input type="checkbox" id="cfg-sfx">
        </div>
        <div class="setting-row">
            <label>Obtiažnosť Bota</label>
            <select id="cfg-diff">
                <option value="0">Ľahký</option><option value="1">Stredný</option><option value="2">Ťažký</option>
            </select>
        </div>
        <div class="setting-row">
            <label>Zelený Nižník na všetko</label><input type="checkbox" id="cfg-fd">
        </div>
        <div class="setting-row">
            <label>Červená 7 na čokoľvek pri vrátení</label><input type="checkbox" id="cfg-r7">
        </div>
        <div class="setting-row">
            <label>Kariet za sedmičku</label><input type="number" id="cfg-draw7" min="1" max="10">
        </div>
        <div class="setting-row">
            <label>Začiatočné karty</label><input type="number" id="cfg-start" min="2" max="10">
        </div>
        <div class="setting-row" style="background: rgba(212, 175, 55, 0.1); padding: 5px; border-radius: 5px;">
            <label style="font-weight:bold; color:var(--gold);">Klasický Žobrák</label><input type="checkbox" id="cfg-zobrak">
        </div>
        <div class="setting-row">
            <label>Limit otočených kariet (Žobrák)</label><input type="number" id="cfg-zobrak-limit" min="1" max="15" value="1">
        </div>
        <div class="setting-row" style="background: rgba(74, 222, 128, 0.1); padding: 5px; border-radius: 5px;">
            <label style="font-weight:bold; color:#4ade80;">Taktický Faraón (karty vždy otočené)</label><input type="checkbox" id="cfg-takticky">
        </div>
        <div class="setting-row">
            <label>Debug mód</label><input type="checkbox" id="cfg-debug">
        </div>
        <button class="btn" style="width:100%; margin: 5px 0 0 0;" onclick="playMenuClick(); saveSettings()">Uložiť a Späť</button>
    </div>
</div>

<div id="screen-game" class="screen">
    <button class="btn" style="position: absolute; top: 10px; right: 10px; width: auto; padding: 6px 15px; font-size: 14px; z-index: 60; margin: 0;" onclick="playMenuClick(); goToMenu()">Do menu</button>
    
    <div id="bot-hand" class="hand"></div>
    
    <div id="table">
        <div id="debug-deck-info" class="debug-label"></div>
        <div class="game-row">
            <div id="turn-token" onclick="playMenuClick(); tokenClick()">TY</div>
            <div id="deck-pile" class="pile-container"></div>
            <div id="discard-pile" class="pile-container"></div>
        </div>
        <div id="debug-discard-info" class="debug-label"></div>
    </div>
    
    <div id="player-hand" class="hand"></div>
</div>

<div id="picker">
    <div style="grid-column: 1/3; color: #4a2f13; text-align: center; font-weight: bold; margin-bottom: 5px;">Vyšník mení! Vyber farbu:</div>
    <button class="p-btn" onclick="playMenuClick(); suitSelect('C')">❤️<br><span style="font-size:11px;">Červeň</span></button>
    <button class="p-btn" onclick="playMenuClick(); suitSelect('G')">🔔<br><span style="font-size:11px;">Guľa</span></button>
    <button class="p-btn" onclick="playMenuClick(); suitSelect('Z')">🍃<br><span style="font-size:11px;">Zeleň</span></button>
    <button class="p-btn" onclick="playMenuClick(); suitSelect('L')">🌰<br><span style="font-size:11px;">Žaluď</span></button>
</div>

<div id="message-overlay">
    <div id="msg-title">VÝHRA!</div>
    <div id="msg-sub"></div>
    <div id="msg-money">+ 25 €</div>
    <div id="msg-timer">Nová hra začne o 5...</div>
</div>

<div id="shuffle-overlay">
    <div class="shuffle-deck">
        <div class="shuffle-card"></div>
        <div class="shuffle-card s-left"></div>
        <div class="shuffle-card s-right"></div>
    </div>
    <h2 id="shuffle-text">Miešam karty...</h2>
</div>

<script>
    const SUITS = { 
        'C': { sym: '❤️', col: '#c11', name: 'ČERVEŇ' }, 
        'G': { sym: '🔔', col: '#d80', name: 'GUĽA' }, 
        'Z': { sym: '🍃', col: '#181', name: 'ZELEŇ' }, 
        'L': { sym: '🌰', col: '#631', name: 'ŽALUĎ' } 
    };
    
    const RANKS = ['7', '8', '9', 'X', 'N', 'V', 'K', 'E'];
    const R_LABELS = { '7':'VII', '8':'VIII', '9':'IX', 'X':'X', 'N':'N', 'V':'V', 'K':'K', 'E':'E' };

    let defaultCfg = { music: true, sfx: true, diff: 1, fd: true, r7: true, draw7: 3, start: 5, zobrak: false, zLimit: 15, takticky: false, debug: false };
    let savedCfg = localStorage.getItem('faraon_cfg');
    let cfg = savedCfg ? { ...defaultCfg, ...JSON.parse(savedCfg) } : defaultCfg;
    
    let storedMoney = localStorage.getItem('faraon_money');
    let money = storedMoney !== null ? parseInt(storedMoney) : 0;
    if (money < 0) money = 0;

    let deck = [], pHand = [], bHand = [], discard = [];
    let turn = 'P', penalty = 0, skip = false, activeSuit = '';
    let currentTurnRank = null; 
    let finalShowdown = false; 
    let faceUpPlayer = ''; 
    let winTimerInterval = null;
    let botTimer = null; 
    let waitingForRed7 = false; 
    
    // Zobrak & Takticky variables
    let pZobrakCount = cfg.start, pZobrakFaceUp = false;
    let bZobrakCount = cfg.start, bZobrakFaceUp = false;

    // --- AUDIO SYSTEM (AudioContext - zero lag, unlimited overlap + iOS prežitie) ---
    const AudioManager = {
        ctx: null,
        bgMusic: new Audio('sfx/hudba.mp3'),
        buffers: {},
        _raw: {},

        init() {
            this.bgMusic.loop = true;
            this.bgMusic.preload = 'auto';
            const sfxList = ['menu','tahanie','stojis','stojim','vyhra','prehra','beries3','beries6','beries9','beries12','zelen','cerven','zalud','gula'];
            
            sfxList.forEach(name => {
                fetch(`sfx/${name}.mp3`)
                    .then(r => r.arrayBuffer())
                    .then(ab => { this._raw[name] = ab; })
                    .catch(() => {});
            });

            // Reakcia na opustenie apky a návrat späť
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    this.pauseBg();
                    if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(()=>{});
                } else {
                    this.playBg();
                    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
                }
            });

            // Defibrilátor audia - tichá kontrola a obnova na KAŽDÝ dotyk. 
            const reviveAudio = () => this.unlock();
            document.addEventListener('touchstart', reviveAudio, { passive: true });
            document.addEventListener('click', reviveAudio, { passive: true });
            document.addEventListener('keydown', reviveAudio, { passive: true });
        },

        async unlock() {
            if (!this.ctx || this.ctx.state === 'closed') {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.buffers = {}; 
            }
            
            if (this.ctx.state === 'suspended' || this.ctx.state === 'interrupted') {
                try { await this.ctx.resume(); } catch(e) {}
            }

            for (const name of Object.keys(this._raw)) {
                if (!this.buffers[name] && this._raw[name]) {
                    try {
                        this.buffers[name] = await this.ctx.decodeAudioData(this._raw[name].slice(0));
                    } catch(e) {}
                }
            }

            if (cfg.music && this.bgMusic.paused && !document.hidden) {
                this.bgMusic.play().catch(() => {});
            }
        },

        play(name) {
            if (!cfg.sfx || !this.ctx || !this.buffers[name]) return;
            try {
                if (this.ctx.state === 'suspended' || this.ctx.state === 'interrupted') {
                    this.ctx.resume().catch(()=>{});
                }
                const src = this.ctx.createBufferSource();
                src.buffer = this.buffers[name];
                src.connect(this.ctx.destination);
                src.start(0);
            } catch(e) {
                if (this.ctx && this.ctx.state === 'closed') {
                    this.ctx = null;
                }
            }
        },

        playBg() {
            if (cfg.music && this.bgMusic.paused && !document.hidden) {
                this.bgMusic.play().catch(() => {});
            }
        },
        pauseBg() {
            if (!this.bgMusic.paused) this.bgMusic.pause();
        }
    };
    
    AudioManager.init();
    AudioManager.playBg(); // Skúsi spustiť okamžite, no prehliadač to môže pozdržať do prvého dotyku používateľa

    function playSfx(name) { AudioManager.play(name); }
    function playMenuClick() { AudioManager.play('menu'); }

    const unlockAudio = async () => {
        await AudioManager.unlock();
    };
    
    // Tieto príkazy sa teraz nevymazávajú. Pri každom dotyku prebudia/skontrolujú audio. 
    ['touchstart', 'click', 'keydown'].forEach(e => document.addEventListener(e, unlockAudio));

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) AudioManager.pauseBg();
        else AudioManager.playBg();
    });

    document.getElementById('money-val').innerText = money;

    // --- STATE MANAGEMENT ---
    function checkSavedGame() {
        let stateStr = localStorage.getItem('faraon_state');
        if (stateStr) {
            document.getElementById('btn-start').innerText = "Nová Hra";
            document.getElementById('btn-continue').style.display = "block";
        } else {
            document.getElementById('btn-start').innerText = "Hrať";
            document.getElementById('btn-continue').style.display = "none";
        }
    }

    function saveGameState() {
        const state = { deck, pHand, bHand, discard, turn, penalty, skip, activeSuit, currentTurnRank, finalShowdown, faceUpPlayer, waitingForRed7, pZobrakCount, pZobrakFaceUp, bZobrakCount, bZobrakFaceUp };
        localStorage.setItem('faraon_state', JSON.stringify(state));
    }

    function loadGameState() {
        const stateStr = localStorage.getItem('faraon_state');
        if (stateStr) {
            try {
                const state = JSON.parse(stateStr);
                deck = state.deck || []; pHand = state.pHand || []; bHand = state.bHand || []; discard = state.discard || [];
                turn = state.turn || 'P'; penalty = state.penalty || 0; skip = state.skip || false; activeSuit = state.activeSuit || '';
                currentTurnRank = state.currentTurnRank || null; finalShowdown = state.finalShowdown || false; faceUpPlayer = state.faceUpPlayer || '';
                waitingForRed7 = state.waitingForRed7 || false;
                pZobrakCount = state.pZobrakCount || cfg.start; pZobrakFaceUp = state.pZobrakFaceUp || false;
                bZobrakCount = state.bZobrakCount || cfg.start; bZobrakFaceUp = state.bZobrakFaceUp || false;
                return true;
            } catch(e) { return false; }
        }
        return false;
    }

    function clearGameState() {
        localStorage.removeItem('faraon_state');
        checkSavedGame();
    }

    checkSavedGame();

    // --- DRAG AND DROP ---
    let dragObj = null;

    function initDragEvents() {
        document.addEventListener('pointermove', onPointerMove, {passive: false});
        document.addEventListener('pointerup', onPointerUp);
        document.addEventListener('pointercancel', onPointerUp);
    }
    
    function startDrag(e, type, idx, el) {
        if (turn !== 'P') return;
        if (type === 'deck' && currentTurnRank !== null) return; 
        
        // Fix: Ak je balicek prazdny ale da sa premiesat, stale umoznime interakciu
        if (type === 'deck' && deck.length === 0 && discard.length <= 1) {
            declareDraw();
            return; 
        }
        
        e.preventDefault();
        playSfx('tahanie');
        const rect = el.getBoundingClientRect();
        
        let c = type === 'hand' ? pHand[idx] : (deck[deck.length - 1] || { rot: 0 }); 
        const ghost = createCardEl(c, type === 'deck', false, c.rot || 0);
        ghost.classList.add('moving-card');
        ghost.style.left = rect.left + 'px';
        ghost.style.top = rect.top + 'px';
        
        document.body.appendChild(ghost);
        
        dragObj = {
            ghost: ghost, type: type, idx: idx,
            offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
            origEl: el
        };
        el.style.opacity = '0.2';
    }

    function onPointerMove(e) {
        if (!dragObj) return;
        e.preventDefault();
        dragObj.ghost.style.left = (e.clientX - dragObj.offsetX) + 'px';
        dragObj.ghost.style.top = (e.clientY - dragObj.offsetY) + 'px';
    }

    function onPointerUp(e) {
        if (!dragObj) return;
        const ghostRect = dragObj.ghost.getBoundingClientRect();
        dragObj.origEl.style.opacity = '1';
        dragObj.ghost.remove();
        
        const discardPile = document.getElementById('discard-pile').getBoundingClientRect();
        const playerHand = document.getElementById('player-hand').getBoundingClientRect();
        
        const overDiscard = rectIntersect(ghostRect, discardPile);
        const overHand = rectIntersect(ghostRect, playerHand);
        
        let type = dragObj.type;
        let idx = dragObj.idx;
        dragObj = null;
        
        if (type === 'hand' && overDiscard) {
            handleCardPlay(idx);
        } else if (type === 'deck' && (overHand || overDiscard)) {
            handleDeckPull();
        }
    }

    function rectIntersect(r1, r2) {
        return !(r2.left > r1.right || r2.right < r1.left || r2.top > r1.bottom || r2.bottom < r1.top);
    }
    initDragEvents();

    // --- UI a ZÁKLADY ---
    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'flex';
    }

    function showSettings() {
        document.getElementById('cfg-debug').checked = cfg.debug;
        document.getElementById('cfg-music').checked = cfg.music;
        document.getElementById('cfg-sfx').checked = cfg.sfx;
        document.getElementById('cfg-diff').value = cfg.diff;
        document.getElementById('cfg-fd').checked = cfg.fd;
        document.getElementById('cfg-r7').checked = cfg.r7;
        document.getElementById('cfg-draw7').value = cfg.draw7;
        document.getElementById('cfg-start').value = cfg.start;
        document.getElementById('cfg-zobrak').checked = cfg.zobrak;
        document.getElementById('cfg-zobrak-limit').value = cfg.zLimit;
        document.getElementById('cfg-takticky').checked = cfg.takticky;
        switchScreen('screen-settings');
    }

    function saveSettings() {
        let oldZobrak = cfg.zobrak;
        let oldTakticky = cfg.takticky;

    function initModeVariables() {
        if (cfg.takticky) {
            pZobrakCount = 1; pZobrakFaceUp = true;
            bZobrakCount = 1; bZobrakFaceUp = true;
        } else if (cfg.zobrak) {

    function getFallbackArt(c) {
        const fData = SUITS[c.f];
        const lab = R_LABELS[c.h];
        let halfContent = '';
        
        if (c.h === 'N') halfContent = `<div class="corner-label">${lab}</div><div class="figure">💂</div><div class="fig-sym sym-niznik">${fData.sym}</div>`;
        else if (c.h === 'V') halfContent = `<div class="corner-label">${lab}</div><div class="figure">💂</div><div class="fig-sym sym-vysnik">${fData.sym}</div>`;
        else if (c.h === 'K') halfContent = `<div class="corner-label">${lab}</div><div class="figure">🏇</div><div class="fig-sym sym-vysnik">${fData.sym}</div>`;
        else if (c.h === 'E') halfContent = `<div class="corner-label">${lab}</div><div class="sym-eso">${fData.sym}</div>`;
        else {
            let count = c.h === 'X' ? 10 : parseInt(c.h);
            let dense = count >= 9 ? 'dense' : '';
            let syms = '';
            for(let i=0; i<count; i++) syms += `<span>${fData.sym}</span>`;
            halfContent = `<div class="corner-label">${lab}</div><div class="sym-grid ${dense}">${syms}</div>`;
        }

        return `<div class="card-inner" style="color:${fData.col}"><div class="half top-half">${halfContent}</div><div class="half bottom-half">${halfContent}</div></div>`;
    }

    function createCardEl(c, hidden, isDiscard, rotation = 0) {
        const el = document.createElement('div');
        el.className = 'card';
        if (isDiscard) {
            el.className += ' discard-card';
            el.style.transform = `rotate(${rotation}deg)`;
        } else if (hidden && c.h === undefined) { 
            el.className += ' deck-card';
            el.style.transform = `rotate(${rotation}deg)`;
        }

        if (hidden) el.className += ' back';
        else el.innerHTML = getFallbackArt(c);
        return el;
    }

    function layoutHand(handArray, containerId, isBot) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        const cardW = 80; const cardH = 125;
        const maxW = window.innerWidth - 40; 
        
        let maxPerRow = Math.max(3, Math.floor((maxW - cardW) / 25) + 1);
        let rowCount = Math.ceil(handArray.length / maxPerRow);
        
        container.style.height = (cardH + (rowCount > 1 ? (rowCount - 1) * (cardH / 2) : 0)) + 'px';
        
        handArray.forEach((c, i) => {
            let row = Math.floor(i / maxPerRow);
            let col = i % maxPerRow;
            
            let cardsInThisRow = Math.min(maxPerRow, handArray.length - row * maxPerRow);
            let step = cardsInThisRow > 1 ? Math.min(40, (maxW - cardW) / Math.max(1, cardsInThisRow - 1)) : 0;
            
            let isHidden = isBot;
            if (cfg.takticky) isHidden = false;
            else if (isBot && c.isFaceUp) isHidden = false; 
            
            const el = createCardEl(c, isHidden, false, 0);
            
            if (c.isFaceUp || cfg.takticky) {
                el.style.border = '2px solid var(--gold)';
                el.style.boxShadow = '0 0 12px var(--gold)';
            }
            
            let rowWidth = cardW + (cardsInThisRow - 1) * step;
            let startX = Math.max(10, (window.innerWidth - rowWidth) / 2);
            
            el.style.left = (startX + col * step) + 'px';
            if(isBot) el.style.top = (row * (cardH / 2)) + 'px';
            else el.style.bottom = ((rowCount - 1 - row) * (cardH / 2)) + 'px';
            
            el.style.zIndex = i;
            
            if (!isBot) {
                el.onpointerdown = (e) => startDrag(e, 'hand', i, el);
            }
            container.appendChild(el);
        });
    }

    // Proaktivne premiesavanie balicka hned v tichosti na pozadí, bez zacyklenia
    function checkAndRefillDeckImmediately() {
        if (deck.length === 0 && discard.length > 1) {
            let topCard = discard.pop(); 
            let newDeck = [...discard]; 
            newDeck.sort(() => Math.random() - 0.5); 
            newDeck.forEach(c => { c.rot = Math.floor(Math.random() * 10) - 5; c.isFaceUp = false; });
            deck = newDeck; 
            discard = [topCard]; 
            doShuffleAnim("Automatické premiešanie balíčka...", () => {});
        }
    }

    function render() {
        // Fix zaseknutia: Pred samotnym vykreslenim overime a hned doplnime prazdny balicek
        if (deck.length === 0 && discard.length > 1) {
            checkAndRefillDeckImmediately();
        }

        layoutHand(pHand, 'player-hand', false);
        layoutHand(bHand, 'bot-hand', true);

        const dp = document.getElementById('discard-pile'); dp.innerHTML = '';
        discard.forEach((c, i) => {
            const el = createCardEl(c, false, true, c.rot);
            if (i < discard.length - 1) el.style.boxShadow = 'none';

        });

        const dk = document.getElementById('deck-pile'); dk.innerHTML = '';
        const stackSize = deck.length;
        for(let i=0; i<stackSize; i++) {
            const c = deck[i];

            el.style.top = `-${i * 0.2}px`;
            el.style.left = `-${i * 0.2}px`;
            el.style.zIndex = i;
            if (i < stackSize - 1) el.style.boxShadow = 'none'; 
            if (i === stackSize - 1) { 
                el.onpointerdown = (e) => startDrag(e, 'deck', 0, el);
            }
            dk.appendChild(el);
        }

        if (cfg.debug) {
            document.getElementById('debug-deck-info').innerText = deck.length;
            document.getElementById('debug-discard-info').innerText = discard.length;
        } else {
            document.getElementById('debug-deck-info').innerText = '';
            document.getElementById('debug-discard-info').innerText = '';
        }

        const token = document.getElementById('turn-token');
        let shownSuit = activeSuit;
        
        if (waitingForRed7) {
            token.style.backgroundColor = '#8b0000';
            token.style.borderColor = '#ff4444';
            token.innerHTML = `<span style='font-size:11px;font-weight:bold;'>VRÁTIŤ!</span><span style='font-size:16px;'>❤️VII</span>`;
        }
        else if (currentTurnRank !== null && turn === 'P') {
            token.style.backgroundColor = '#5c3a21';
            token.style.borderColor = 'var(--gold)';
            token.innerHTML = `<span style='font-size:16px;color:#4ade80;'>OK</span><span style='font-size:9px;'>Ukončiť</span>`;
        }
        else if (turn === 'P') {
            token.style.backgroundColor = '#5c3a21';
            token.style.borderColor = 'var(--gold)';
            
            if (skip) token.innerHTML = `<span style='font-size:18px;'>✋</span><span style='font-size:9px;'>Stojíš</span>`;
            else if (penalty > 0) token.innerHTML = `<span style='font-size:16px;color:#f44;'>+${penalty}</span><span style='font-size:9px;'>Brať</span>`;
            else token.innerHTML = `<span style='font-size:14px;font-weight:bold;'>TY</span><span style='font-size:16px;'>${SUITS[shownSuit].sym}</span>`;
        } else {
            token.style.backgroundColor = '#222';
            token.style.borderColor = '#555';
            if (currentTurnRank !== null) {
                token.innerHTML = `<span style='font-size:13px;color:#aaa;'>BOT...</span><span style='font-size:16px;'>${SUITS[shownSuit].sym}</span>`;
            }
            else if (skip) token.innerHTML = `<span style='font-size:18px;'>✋</span><span style='font-size:9px;'>Bot stojí</span>`;
            else if (penalty > 0) token.innerHTML = `<span style='font-size:16px;color:#f44;'>+${penalty}</span><span style='font-size:9px;'>Bot berie</span>`;
            else token.innerHTML = `<span style='font-size:13px;color:#aaa;'>BOT...</span><span style='font-size:16px;'>${SUITS[shownSuit].sym}</span>`;
        }
        saveGameState();
    }

    function startNewTournament() {
        initModeVariables();
        finalShowdown = false;
        faceUpPlayer = '';
        waitingForRed7 = false;
        clearGameState();
        startGame(false);
    }

    function startGame(resume = false) {
        switchScreen('screen-game');

        if (resume && loadGameState()) {
            render();
            if (turn === 'B') {
                if (botTimer) clearTimeout(botTimer);
                botTimer = setTimeout(botLogic, 1000);
            }
            return;
        }

        waitingForRed7 = false;

        doShuffleAnim("Miešam karty...", () => {
            deck = [];
            for(let f in SUITS) {
                for(let h of RANKS) deck.push({ f, h, rot: Math.floor(Math.random() * 10) - 5, isFaceUp: false });
            }
            deck.sort(() => Math.random() - 0.5);
            
            pHand = []; bHand = []; discard = []; currentTurnRank = null;
            
            for(let i=0; i<pZobrakCount; i++) {
                let c = deck.pop(); c.rot = 0; 
                if (cfg.takticky) c.isFaceUp = true;
                else if (cfg.zobrak && pZobrakFaceUp) c.isFaceUp = true; 
                pHand.push(c);
            }
            for(let i=0; i<bZobrakCount; i++) {
                let c = deck.pop(); c.rot = 0; 
                if (cfg.takticky) c.isFaceUp = true;
                else if (cfg.zobrak && bZobrakFaceUp) c.isFaceUp = true;
                bHand.push(c);
            }
            
            let first = deck.pop(); 
            first.rot = Math.floor(Math.random() * 30) - 15;
            discard.push(first); 
            activeSuit = first.f;
            turn = 'P'; penalty = 0; skip = false;
            
            render();
        });
    }

    function pull(h) {
        if (deck.length === 0) checkAndRefillDeckImmediately();
        if (deck.length > 0) {
            let c = deck.pop();
            c.rot = 0; 
            if (cfg.takticky) c.isFaceUp = true;
            else c.isFaceUp = false; 
            h.push(c);
        }
        if (deck.length === 0) checkAndRefillDeckImmediately();
    }

    function isValid(c) {
        const top = discard[discard.length-1];
        
        if (waitingForRed7) {
            if (cfg.r7) return c.h === '7' && c.f === 'C';
            return c.h === '7' && c.f === 'C' && (activeSuit === 'C' || (cfg.fd && top.h === 'N' && top.f === 'Z'));
        }

        if (penalty > 0 && c.h === 'N' && c.f === 'Z') return true;

        if (cfg.fd && top.h === 'N' && top.f === 'Z') return true;
        if (cfg.fd && c.h === 'N' && c.f === 'Z') return true; 

        if (!cfg.fd && c.h === 'N' && c.f === 'Z') {
            return (activeSuit === 'Z' || top.h === '7');
        }

        if (penalty > 0 && c.h === '7' && c.f === 'C') return true; 
        if (penalty > 0) return c.h === '7';
        if (skip) return c.h === 'E';
        return (c.f === activeSuit || c.h === top.h || c.h === 'V');
    }

    function hasMoreOfRank(hand, rank) {
        return hand.some(c => c.h === rank);
    }

    function handleCardPlay(idx) {
        const c = pHand[idx];
        if (currentTurnRank !== null && c.h !== currentTurnRank) return;
        if (currentTurnRank === null && !isValid(c)) return;

        if (waitingForRed7) {
            if (c.h !== '7') return;
            waitingForRed7 = false;
            pHand.splice(idx, 1);
            c.rot = Math.floor(Math.random() * 30) - 15;
            discard.push(c);
            activeSuit = c.f;
            currentTurnRank = c.h;
            playSfx('tahanie');
            
            penalty += cfg.draw7;
            
            if (pHand.length === 0) { currentTurnRank = null; handleEndRoundAttempt('P'); return; }
            
            if (hasMoreOfRank(pHand, currentTurnRank)) {
                render(); 
            } else {
                currentTurnRank = null; 
                endTurn(); 
            }
            return;
        }

        pHand.splice(idx, 1);
        c.rot = Math.floor(Math.random() * 30) - 15; 
        discard.push(c);
        activeSuit = c.f;
        currentTurnRank = c.h;
        playSfx('tahanie');

        if (c.h === 'N' && c.f === 'Z') { penalty = 0; skip = false; } 
        else if (c.h === '7') { penalty += cfg.draw7; }
        else if (c.h === 'E') { skip = true; }

        if (pHand.length === 0) { currentTurnRank = null; handleEndRoundAttempt('P'); return; }

        if (hasMoreOfRank(pHand, currentTurnRank)) {
            render();
        } else {
            if (c.h === 'V') document.getElementById('picker').style.display = 'grid';
            else { currentTurnRank = null; endTurn(); }
        }
    }

    function handleEndRoundAttempt(winner) {
        const loserHand = winner === 'P' ? bHand : pHand;
        const hasRed7 = loserHand.some(c => c.h === '7' && c.f === 'C');
        const top = discard[discard.length-1];
        
        let canPlayRed7 = false;
        if (hasRed7) {
            if (cfg.r7) canPlayRed7 = true;
            else {
                canPlayRed7 = (activeSuit === 'C' || (cfg.fd && top.h === 'N' && top.f === 'Z'));
            }
        }

        if (canPlayRed7) {
            if (winner === 'P') { 
                turn = 'B';
                render();
                
                setTimeout(() => {
                    let r7idx = bHand.findIndex(c => c.h === '7' && c.f === 'C');
                    let r7c = bHand.splice(r7idx, 1)[0];
                    animateBotPlay(r7c, () => {
                        discard.push(r7c); activeSuit = 'C';
                        playSfx('tahanie');
                        
                        let amt = penalty + cfg.draw7;
                        let target = 0;
                        let completed = 0;
                        
                        function finishDraw() {
                            penalty = 0;
                            turn = 'B'; 
                            render();
                            botTimer = setTimeout(botLogic, 1000);
                        }

                        for(let i=0; i<amt; i++) {
                            if (deck.length === 0) checkAndRefillDeckImmediately();
                            if (deck.length === 0 && discard.length <= 1) { declareDraw(); return; }
                            if (deck.length > 0) {
                                target++;
                                let drawnCard = deck.pop();
                                drawnCard.rot = 0;
                                if (cfg.takticky) drawnCard.isFaceUp = true;
                                else drawnCard.isFaceUp = false;
                                
                                animatePlayerPull(drawnCard, () => {
                                    pHand.push(drawnCard);
                                    completed++;
                                    if (completed === target) finishDraw();
                                });
                            }
                        }
                        if (target === 0) finishDraw();
                    });
                }, 1000);
                return;
            } else { 
                waitingForRed7 = true;
                turn = 'P';
                render();
                return;
            }
        }
        
        checkWin(winner);
    }

    function applyTurnTransferSounds() {
        if (skip) playSfx('stojis');
        else if (penalty === 3) playSfx('beries3');
        else if (penalty === 6) playSfx('beries6');
        else if (penalty === 9) playSfx('beries9');
        else if (penalty >= 12) playSfx('beries12');
    }

    function tokenClick() {
        if (turn !== 'P') return;
        if (waitingForRed7) return; 
        
        if (currentTurnRank !== null) {
            const top = discard[discard.length-1];
            if (top.h === 'V') document.getElementById('picker').style.display = 'grid';
            else { currentTurnRank = null; endTurn(); }
        } else if (skip) {
            skip = false;
            endTurn(); 
        }
    }

    function handleDeckPull() {
        if (turn !== 'P' || currentTurnRank !== null) return;
        
        if (waitingForRed7) { 
            waitingForRed7 = false;
            checkWin('B');
            return;
        }

        playSfx('tahanie');
        if (penalty > 0) { 
            for(let i=0; i<penalty; i++) {
                if (deck.length === 0 && discard.length <= 1) { declareDraw(); return; }
                pull(pHand);
            }
            penalty = 0; 
            endTurn();
        } else if (skip) { 
            skip = false; 
            endTurn();
        } else { 
            if (deck.length === 0 && discard.length <= 1) { declareDraw(); return; }
            pull(pHand); 
            endTurn();
        }
    }

    function endTurn() {
        turn = (turn === 'P' ? 'B' : 'P');
        if (turn === 'P') applyTurnTransferSounds(); 
        render();
        if (turn === 'B') botTimer = setTimeout(botLogic, 1000);
    }

    function animateBotPlay(card, onComplete) {
        const botHandEl = document.getElementById('bot-hand');
        const discardPileEl = document.getElementById('discard-pile');
        
        const bRect = botHandEl.getBoundingClientRect();
        const dRect = discardPileEl.getBoundingClientRect();
        
        const ghost = createCardEl(card, false, false, 0);
        ghost.classList.add('bot-anim-card');
        ghost.style.left = bRect.left + (bRect.width/2) - 40 + 'px';
        ghost.style.top = bRect.bottom - 125 + 'px';
        document.body.appendChild(ghost);
        
        playSfx('tahanie');
        
        requestAnimationFrame(() => {
            ghost.style.left = dRect.left + 'px';
            ghost.style.top = dRect.top + 'px';
            const rot = Math.floor(Math.random() * 30) - 15;
            ghost.style.transform = `rotate(${rot}deg)`;
            card.rot = rot; 
        });
        
        setTimeout(() => {
            ghost.remove();
            if(onComplete) onComplete();
        }, 300);
    }

    async function botLogic() {
        if (skip) {
            let aceIdx = bHand.findIndex(c => c.h === 'E');
            if (aceIdx !== -1) { 
                let c = bHand.splice(aceIdx, 1)[0];
                currentTurnRank = 'E';
                animateBotPlay(c, () => {
                    discard.push(c); activeSuit = c.f;
                    skip = true; 
                    currentTurnRank = null;
                    turn = 'P';
                    if (bHand.length === 0) handleEndRoundAttempt('B'); 
                    else { render(); applyTurnTransferSounds(); }
                });
            } else { 
                skip = false; 
                playSfx('stojim');
                turn = 'P'; 
                render();
                applyTurnTransferSounds();
            }
            return;
        }

        if (penalty > 0) {
            let choiceIdx = bHand.findIndex(c => c.h === '7');
            if (choiceIdx === -1) {
                choiceIdx = bHand.findIndex(c => c.h === 'N' && c.f === 'Z');
            }

            if (choiceIdx !== -1) {
                let c = bHand.splice(choiceIdx, 1)[0];
                currentTurnRank = c.h;
                animateBotPlay(c, () => {
                    discard.push(c); 
                    activeSuit = c.f; 
                    if (c.h === '7') {
                        penalty += cfg.draw7;
                    } else {
                        penalty = 0;
                    }
                    currentTurnRank = null;
                    turn = 'P';
                    if (bHand.length === 0) handleEndRoundAttempt('B'); 
                    else { render(); applyTurnTransferSounds(); }
                });
            } else {
                let amt = penalty;
                penalty = 0;
                let target = 0;
                let completed = 0;

                function finishDraw() {
                    turn = 'P';
                    render();
                }

                for (let i = 0; i < amt; i++) {
                    if (deck.length === 0) checkAndRefillDeckImmediately();
                    if (deck.length === 0 && discard.length <= 1) { declareDraw(); return; }
                    if (deck.length > 0) {
                        target++;
                        let drawnCard = deck.pop();
                        drawnCard.rot = 0;
                        if (cfg.takticky) drawnCard.isFaceUp = true;
                        animateBotPull(drawnCard, () => {
                            bHand.push(drawnCard);
                            completed++;
                            if (completed === target) finishDraw();
                        });
                    }
                }
                if (target === 0) finishDraw();
            }
            return;
        }

        let validIndices = [];
        bHand.forEach((c, i) => { if (isValid(c)) validIndices.push(i); });

        let choiceIdx = validIndices.length > 0 ? validIndices[0] : -1;
        let bestWeight = -9999;
        
        let allSameRank = bHand.length > 0 && bHand.every(c => c.h === bHand[0].h);
        let canWinInstantly = allSameRank && validIndices.length > 0;
        
        let inFinale = (finalShowdown && (faceUpPlayer === 'P' || faceUpPlayer === 'BOTH'));
        let isTakticky = cfg.takticky;
        
        let useSmartAI = false;
        let usePredictiveAI = false;

        if (cfg.diff === 0) {
            if (inFinale || isTakticky) useSmartAI = true;
        } else if (cfg.diff === 1) {
            useSmartAI = true;
            if (inFinale || isTakticky) {
                useSmartAI = false;
                usePredictiveAI = true;
            }
        } else if (cfg.diff === 2) {
            usePredictiveAI = true;
        }

        if (canWinInstantly) {
            choiceIdx = validIndices[0];
            bestWeight = 10000;
        } else if (validIndices.length > 0) {
            let scoredMoves = [];

            if (usePredictiveAI) {
                let pVisSuits = new Set();
                let pVisRanks = new Set();
                let pKnown = 0;
                let pVisible7 = 0;
                let pVisibleE = 0;
                
                pHand.forEach(c => {
                    if (c.isFaceUp || cfg.takticky) {
                        pVisSuits.add(c.f);
                        pVisRanks.add(c.h);
                        pKnown++;
                        if (c.h === '7') pVisible7++;
                        if (c.h === 'E') pVisibleE++;
                    }
                });
                
                let pAlmostWin = pHand.length <= 2;
                let bAlmostWin = bHand.length <= 2;

                validIndices.forEach(idx => {
                    let c = bHand[idx];
                    let weight = 0;
                    let sameRankCount = bHand.filter(bc => bc.h === c.h).length;
                    let seenInSuit = discard.filter(dc => dc.f === c.f).length + bHand.filter(bc => bc.f === c.f).length;
                    let isGreenJack = (c.h === 'N' && c.f === 'Z');

                    if (c.h === '7') weight += 40;
                    if (c.h === 'E') weight += 35;
                    if (c.h === 'V') weight += 30;

                    if (pAlmostWin) {
                        if (c.h === '7') weight += 100;
                        if (c.h === 'E') weight += 100;
                        if (c.h === 'V') weight += 800;
                        
                        if (c.h === discard[discard.length-1].h && c.f !== activeSuit) {
                            weight += 600; 
                        } else if (c.f === activeSuit && c.h !== 'V') {
                            weight -= 100; 
                        }

                        if (isGreenJack && cfg.fd) weight -= 500; 

                        if (discard[discard.length-1].h === 'V' && c.h === 'V') {
                            weight += 2000;
                        }
                    }

                    if (pKnown > 0) {
                        let matchesPlayer = false;
                        
                        if (c.h === '7') {
                            matchesPlayer = pVisRanks.has('7'); 
                        } else if (c.h === 'E' || c.h === 'V') {
                            matchesPlayer = false; 
                        } else if (isGreenJack && cfg.fd) {
                            matchesPlayer = true; 
                        } else {
                            if (pVisSuits.has(c.f) || pVisRanks.has(c.h)) matchesPlayer = true;
                        }

                        if (matchesPlayer) {
                            if (pAlmostWin) weight -= 800; 
                            else weight -= 15; 
                        } else {
                            weight += 50; 
                        }

                        if (c.h === '7' && pVisRanks.has('7')) {
                            if (bHand.filter(x => x.h === '7').length > pVisible7) {
                                weight += 200;
                            } else {
                                weight -= 5000;
                            }
                        }
                        if (c.h === 'E' && pVisRanks.has('E')) {
                            if (bHand.filter(x => x.h === 'E').length > pVisibleE) {
                                weight += 200;
                            } else {
                                weight -= 5000;
                            }
                        }
                    } else {
                        if (pAlmostWin) {
                            weight += seenInSuit * 3; 
                        } else {
                            if (['8', '9', 'X', 'K', 'N'].includes(c.h) && !isGreenJack) weight += 15;
                        }
                    }

                    weight += sameRankCount * 8; 

                    if (bAlmostWin) {
                        weight += 200; 
                        
                        if (pKnown > 0 && pAlmostWin) {
                            let helpsPlayer = pVisSuits.has(c.f) || pVisRanks.has(c.h) || (isGreenJack && cfg.fd);
                            if (helpsPlayer) {
                                weight -= 600; 
                            }
                        }
                    }

                    weight += Math.floor(Math.random() * 10); 
                    scoredMoves.push({idx: idx, weight: weight});
                });
            } else if (useSmartAI) {
                let pVisRanks = new Set();
                let pVisible7 = 0;
                let pVisibleE = 0;
                pHand.forEach(c => {
                    if (c.isFaceUp || cfg.takticky) {
                        pVisRanks.add(c.h);
                        if (c.h === '7') pVisible7++;
                        if (c.h === 'E') pVisibleE++;
                    }
                });

                validIndices.forEach(idx => {
                    let weight = 0;
                    let c = bHand[idx];
                    if (c.h === '7') weight += 10;
                    if (c.h === 'E') weight += 8;
                    if (c.h === 'N' && c.f === 'Z') weight += 5;
                    
                    if (c.h === '7' && pVisRanks.has('7')) {
                        if (bHand.filter(x => x.h === '7').length > pVisible7) weight += 15; 
                        else weight -= 5000;
                    }
                    if (c.h === 'E' && pVisRanks.has('E')) {
                        if (bHand.filter(x => x.h === 'E').length > pVisibleE) weight += 15; 
                        else weight -= 5000;
                    }
                    
                    weight += Math.floor(Math.random() * 4);
                    scoredMoves.push({idx: idx, weight: weight});
                });
            } else {
                validIndices.forEach(idx => scoredMoves.push({idx: idx, weight: 0}));
            }

            if (scoredMoves.length > 0) {
                scoredMoves.sort((a, b) => b.weight - a.weight);
                let chosenMove = scoredMoves[0];

                if (scoredMoves.length > 1 && cfg.diff > 0) {
                    let w0 = scoredMoves[0].weight;
                    let w1 = scoredMoves[1].weight;
                    
                    if ((w0 - w1) < 150 && Math.random() < 0.25) {
                        chosenMove = scoredMoves[1];
                    } else if (scoredMoves.length > 2) {
                        let w2 = scoredMoves[2].weight;
                        if ((w0 - w2) < 100 && Math.random() < 0.10) {
                            chosenMove = scoredMoves[2];
                        }
                    }
                }
                
                choiceIdx = chosenMove.idx;
                bestWeight = chosenMove.weight;
            }
        }

        let shouldPlay = validIndices.length > 0;
        
        if (usePredictiveAI && shouldPlay && bestWeight < -100 && (pHand.length <= 2) && !canWinInstantly) {
            shouldPlay = false;
        }

        if (shouldPlay) {
            let baseCard = bHand[choiceIdx];
            let rankToPlay = baseCard.h;
            let playedCards = [];
            
            let prePlayActiveSuit = activeSuit; 
            let pVisRanksGlobal = new Set();
            
            pHand.forEach(c => { 
                if(c.isFaceUp || cfg.takticky) { 
                    pVisRanksGlobal.add(c.h); 
                } 
            });

            if (usePredictiveAI) {
                let pVisSuits = new Set();
                pHand.forEach(c => { 
                    if(c.isFaceUp || cfg.takticky) { 
                        pVisSuits.add(c.f); 
                    } 
                });

                let sameRankCards = bHand.filter(c => c.h === rankToPlay);
                
                let legalOptions = sameRankCards.filter(c => isValid(c));
                let firstCard = legalOptions.find(c => pVisSuits.has(c.f) || (cfg.fd && c.h === 'N' && c.f === 'Z')) || legalOptions[0] || baseCard;

                let others = sameRankCards.filter(c => c !== firstCard);
                
                if (canWinInstantly) {
                    playedCards = [firstCard, ...others];
                } else if (['7', 'E', 'V'].includes(rankToPlay)) {
                    if ((rankToPlay === '7' || rankToPlay === 'E') && pVisRanksGlobal.has(rankToPlay)) {
                        playedCards = [firstCard];
                    } else {
                        playedCards = [firstCard, ...others];
                    }
                } else {
                    let othersSafe = others.filter(c => !pVisSuits.has(c.f) && !(cfg.fd && c.h === 'N' && c.f === 'Z'));
                    let othersBad = others.filter(c => pVisSuits.has(c.f) || (cfg.fd && c.h === 'N' && c.f === 'Z'));

                    if (pHand.length <= 3) {
                        if (othersSafe.length > 0) {
                            playedCards = [firstCard, ...othersBad, ...othersSafe];
                        } else {
                            playedCards = [firstCard];
                        }
                    } else {
                        playedCards = [firstCard, ...othersBad, ...othersSafe];
                    }
                }
            } else {
                let sameRankCards = bHand.filter(c => c.h === rankToPlay);
                let firstCard = sameRankCards.find(c => isValid(c)) || baseCard;
                let others = sameRankCards.filter(c => c !== firstCard);
                
                if (canWinInstantly) {
                    playedCards = [firstCard, ...others];
                } else if ((rankToPlay === '7' || rankToPlay === 'E') && pVisRanksGlobal.has(rankToPlay)) {
                    playedCards = [firstCard];
                } else {
                    playedCards = [firstCard, ...others];
                }
            }
            
            let finalPlayedCards = [playedCards.find(c => c === baseCard) || playedCards[0]];
            playedCards.forEach(c => { if(c !== finalPlayedCards[0]) finalPlayedCards.push(c); });
            playedCards = finalPlayedCards;
            
            playedCards.forEach(pc => {
                let i = bHand.findIndex(c => c === pc);
                if (i !== -1) bHand.splice(i, 1);
            });
            
            currentTurnRank = rankToPlay;
            for(let i = 0; i < playedCards.length; i++) {
                let c = playedCards[i];
                await new Promise(res => {
                    animateBotPlay(c, () => {
                        discard.push(c); activeSuit = c.f;
                        if (c.h === 'N' && c.f === 'Z') { penalty = 0; skip = false; }
                        else if (c.h === '7') { penalty += cfg.draw7; }
                        else if (c.h === 'E') { skip = true; }
                        render();
                        res();
                    });
                });
            }

            if (bHand.length === 0) { 
                currentTurnRank = null;
                handleEndRoundAttempt('B'); 
                return; 
            }

            const finalTop = discard[discard.length-1];
            if (finalTop.h === 'V') {
                let sc = {'C':0,'G':0,'Z':0,'L':0};
                if (usePredictiveAI) {
                    bHand.forEach(bc => sc[bc.f] += 3);
                    discard.forEach(dc => sc[dc.f] += 1);
                    pHand.forEach(pc => {
                        if ((pc.isFaceUp || cfg.takticky) && pHand.length <= 3) {
                            sc[pc.f] -= 999; 
                        }
                    });
                    if (pHand.length <= 2) {
                        sc[prePlayActiveSuit] -= 5000; 
                    }
                } else {
                    bHand.forEach(bc => sc[bc.f]++);
                }
                activeSuit = Object.keys(sc).reduce((a, b) => sc[a] >= sc[b] ? a : b);
                
                if(activeSuit === 'C') playSfx('cerven');
                else if(activeSuit === 'G') playSfx('gula');
                else if(activeSuit === 'Z') playSfx('zelen');
                else if(activeSuit === 'L') playSfx('zalud');
            }
            currentTurnRank = null;
            turn = 'P'; 
            render();
            applyTurnTransferSounds();
        } else {
            if (deck.length === 0) checkAndRefillDeckImmediately();
            if (deck.length === 0 && discard.length <= 1) { declareDraw(); return; }
            if (deck.length > 0) {
                let drawnCard = deck.pop();
                drawnCard.rot = 0;
                if (cfg.takticky) drawnCard.isFaceUp = true;
                animateBotPull(drawnCard, () => {
                    bHand.push(drawnCard);
                    turn = 'P';
                    render();
                });
            } else {
                turn = 'P';
                render();
            }
        }
    }

    function suitSelect(f) {
        activeSuit = f;
        document.getElementById('picker').style.display = 'none';
        currentTurnRank = null;
        endTurn();
    }

    function declareDraw() {
        if(botTimer) clearTimeout(botTimer);
        render();
        playSfx('menu');
        
        let ov = document.getElementById('message-overlay');
        let title = document.getElementById('msg-title');
        let sub = document.getElementById('msg-sub');
        let mon = document.getElementById('msg-money');
        let tmr = document.getElementById('msg-timer');
        
        ov.style.display = 'flex';
        sub.innerText = "Nezostali žiadne karty na ťahanie.";
        
        title.innerText = "REMÍZA";
        title.style.color = "#ffeb3b";
        mon.innerText = "0 €";
        mon.style.color = "#aaa";
        
        let count = 5;
        tmr.innerText = `Nová hra začne o ${count}...`;
        winTimerInterval = setInterval(() => {
            count--;
            tmr.innerText = `Nová hra začne o ${count}...`;
            if (count <= 0) { 
                clearInterval(winTimerInterval); 
                ov.style.display = 'none'; 
                clearGameState();
                startGame(false); 
            }
        }, 1000);
    }

    function checkWin(winner) {
        render();
        let win = winner === 'P';
        if(win) playSfx('vyhra'); else playSfx('prehra');
        let diffMoney = Math.floor(Math.random() * 50) + 1;
        
        let ov = document.getElementById('message-overlay');
        let title = document.getElementById('msg-title');
        let sub = document.getElementById('msg-sub');
        let mon = document.getElementById('msg-money');
        let tmr = document.getElementById('msg-timer');
        
        ov.style.display = 'flex';
        sub.innerText = "";
        
        if (cfg.takticky || cfg.zobrak) {
            mon.innerText = cfg.takticky ? "Taktický mód" : "Žobrák";
            mon.style.color = "#d4af37";
            let modeLimit = cfg.takticky ? 15 : cfg.zLimit;
            
            if (win) {
                title.innerText = "VYHRAL SI KOLO!";
                title.style.color = "#4ade80";
                
                if (finalShowdown) {
                    if (faceUpPlayer === 'B') {
                        title.innerText = "CELKOVÁ VÝHRA HRY!";
                        clearGameState();
                    } else if (faceUpPlayer === 'P') {
                        if (cfg.takticky) {
                            bZobrakCount = Math.min(modeLimit, bZobrakCount + 1);
                            sub.innerText = `Bot bude mať ${bZobrakCount} kariet. Ty máš ${pZobrakCount}.`;
                            if (bZobrakCount === modeLimit) faceUpPlayer = 'BOTH';
                        } else {
                            if (!bZobrakFaceUp) {
                                if (bZobrakCount > 1) bZobrakCount--;
                                else bZobrakFaceUp = true;
                            } else {
                                bZobrakCount++;
                            }
                            let rep = bZobrakFaceUp ? bZobrakCount : 0;
                            sub.innerText = `Bot má ${rep} z ${modeLimit} otočených kariet.`;
                            if (bZobrakCount === modeLimit && bZobrakFaceUp) faceUpPlayer = 'BOTH';
                        }
                    } else if (faceUpPlayer === 'BOTH') {
                        title.innerText = "KONIEC - CELKOVÝ VÍŤAZ!";
                        clearGameState();
                    }
                } else {
                    if (cfg.takticky) {
                        bZobrakCount++;
                        sub.innerText = `Bot bude mať ${bZobrakCount} kariet. Ty máš ${pZobrakCount}.`;
                        if (bZobrakCount === modeLimit) { finalShowdown = true; faceUpPlayer = 'B'; sub.innerText += " BOT IDE DO FINÁLE!"; }
                    } else {
                        if (!bZobrakFaceUp) {
                            if (bZobrakCount > 1) bZobrakCount--;
                            else bZobrakFaceUp = true;
                        } else {
                            bZobrakCount++;
                        }
                        let rep = bZobrakFaceUp ? bZobrakCount : 0;
                        sub.innerText = `Bot má ${rep} z ${modeLimit} otočených kariet.`;
                        if (bZobrakCount === modeLimit && bZobrakFaceUp) { finalShowdown = true; faceUpPlayer = 'B'; sub.innerText = "BOT DOSIAHOL LIMIT! BOT IDE DO FINÁLE!"; }
                    }
                }
            } else {
                title.innerText = "BOT VYHRAL KOLO.";
                title.style.color = "#ff4444";
                
                if (finalShowdown) {
                    if (faceUpPlayer === 'P') {
                        title.innerText = "CELKOVÁ PREHRA HRY!";
                        clearGameState();
                    } else if (faceUpPlayer === 'B') {
                        if (cfg.takticky) {
                            pZobrakCount = Math.min(modeLimit, pZobrakCount + 1);
                            sub.innerText = `Budeš mať ${pZobrakCount} kariet. Bot má ${bZobrakCount}.`;
                            if (pZobrakCount === modeLimit) faceUpPlayer = 'BOTH';
                        } else {
                            if (!pZobrakFaceUp) {
                                if (pZobrakCount > 1) pZobrakCount--;
                                else pZobrakFaceUp = true;
                            } else {
                                pZobrakCount++;
                            }
                            let rep = pZobrakFaceUp ? pZobrakCount : 0;
                            sub.innerText = `Máš ${rep} z ${modeLimit} otočených kariet.`;
                            if (pZobrakCount === modeLimit && pZobrakFaceUp) faceUpPlayer = 'BOTH';
                        }
                    } else if (faceUpPlayer === 'BOTH') {
                        title.innerText = "KONIEC - PREHRAL SI!";
                        clearGameState();
                    }
                } else {
                    if (cfg.takticky) {
                        pZobrakCount++;
                        sub.innerText = `Budeš mať ${pZobrakCount} kariet. Bot má ${bZobrakCount}.`;
                        if (pZobrakCount === modeLimit) { finalShowdown = true; faceUpPlayer = 'P'; sub.innerText += " IDEŠ DO FINÁLE!"; }
                    } else {
                        if (!pZobrakFaceUp) {
                            if (pZobrakCount > 1) pZobrakCount--;
                            else pZobrakFaceUp = true;
                        } else {
                            pZobrakCount++;
                        }
                        let rep = pZobrakFaceUp ? pZobrakCount : 0;
                        sub.innerText = `Máš ${rep} z ${modeLimit} otočených kariet.`;
                        if (pZobrakCount === modeLimit && pZobrakFaceUp) { finalShowdown = true; faceUpPlayer = 'P'; sub.innerText = "DOSIAHOL SI LIMIT! IDEŠ DO FINÁLE!"; }
                    }
                }
            }
        } else {
            clearGameState(); 
            if (win) {
                title.innerText = "VYHRAL SI!";
                title.style.color = "#d4af37";
                mon.innerText = `+ ${diffMoney} €`;
                mon.style.color = "#4ade80";
                money += diffMoney;
            } else {
                title.innerText = "PREHRAL SI.";
                title.style.color = "#ff4444";
                mon.innerText = `- ${diffMoney} €`;
                mon.style.color = "#ff4444";
                money = Math.max(0, money - diffMoney);
            }
            localStorage.setItem('faraon_money', money);
            document.getElementById('money-val').innerText = money;
        }
        
        let count = 5;
        tmr.innerText = `Nová hra začne o ${count}...`;
        winTimerInterval = setInterval(() => {
            count--;
            tmr.innerText = `Nová hra začne o ${count}...`;
            if (count <= 0) { 
                clearInterval(winTimerInterval); 
                ov.style.display = 'none'; 
                if ((cfg.zobrak || cfg.takticky) && (title.innerText.includes("CELKOVÁ") || title.innerText.includes("VÍŤAZ") || title.innerText.includes("PREHRA!"))) {
                    switchScreen('screen-menu');
                } else {
                    startGame(false); 
                }
            }
        }, 1000);
    }
</script>
